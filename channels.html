
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>RIMALTECH</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{--g:#dfc184;--b:#090909}
*{box-sizing:border-box}
body{margin:0;background:var(--b);color:#eee;font:14px Arial}
button,input{font:inherit}
header{height:65px;padding:8px 18px;display:flex;align-items:center;justify-content:space-between;background:#0c0c0c;border-bottom:1px solid #292929}
.brand{direction:ltr;font-size:25px;font-weight:900}
.brand span,.welcome span{color:var(--g)}
.info{display:flex;text-align:center;background:#15130f;border:1px solid #5b4c30;border-radius:14px;overflow:hidden;font-size:12px}
.info>div{padding:9px 14px}
.info small{display:block;color:#aaa;margin-bottom:5px}
.info strong{color:var(--g)}
.shell{direction:ltr;display:grid;grid-template-columns:1fr 1fr;margin:12px;height:calc(100dvh - 89px);min-height:300px;border:1px solid #302a20;border-radius:16px;overflow:hidden}
aside,main{direction:rtl;min-width:0;min-height:0}
aside{display:flex;flex-direction:column;border-left:1px solid #292929}
.sidehead{padding:15px;border-bottom:1px solid #292929}
h2{margin:0;font-size:19px}
.search{width:100%;margin-top:12px;padding:12px;background:#151515;color:white;border:1px solid #444;border-radius:9px}
.list{flex:1;overflow:auto}
.channel{display:block;width:100%;padding:20px 16px;text-align:right;background:#111;color:#eee;border:0;border-bottom:1px solid #292929;font-size:21px;font-weight:900;cursor:pointer;transition:.25s}
.channel:hover{background:#292216;color:var(--g);padding-right:23px}
.channel.active{background:linear-gradient(90deg,#17130d,#302514);color:var(--g);border-right:5px solid var(--g);animation:channelClick .4s ease}
.channel:active{transform:scale(.97)}
@keyframes channelClick{0%{transform:translateX(15px);opacity:.5}60%{transform:translateX(-4px)}100%{transform:translateX(0);opacity:1}}
main{display:flex;flex-direction:column;padding:14px;gap:10px}
#title{font-size:20px;font-weight:bold;overflow-wrap:anywhere}
#group{font-size:13px;color:var(--g);margin-top:6px}
.player{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;border:1px solid #302a20;border-radius:13px}
video,.nature{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
video{background:#000;z-index:2}
.nature{object-fit:cover}
.welcome,#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#0008}
.welcome h1{direction:ltr;font-size:clamp(30px,5vw,60px)}
.welcome p{color:var(--g)}
#loading{z-index:4;background:#000;flex-direction:column;gap:15px;color:var(--g)}
#loading[hidden],.welcome[hidden],.playing #loading,.playing .welcome{display:none!important}
#loading p{margin:0;color:#c6b58e}
.spinner{width:30px;height:30px;border:3px solid #393021;border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.controls{position:absolute;z-index:5;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:9px;padding:9px 12px;background:#101010ed;border:1px solid #80683c;border-radius:14px;opacity:0;visibility:hidden;transition:.2s}
.playing .controls{opacity:1;visibility:visible}
.hide .controls{opacity:0;visibility:hidden}
.ctrl{width:44px;height:44px;cursor:pointer;display:grid;place-items:center;background:#211c13;border:1px solid #5b4c30;border-radius:11px;color:var(--g)}
.ctrl svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.footer{display:flex;justify-content:space-between;color:#888;font-size:10px}
.footer b{color:var(--g)}
@media(max-width:650px){
header{height:54px;padding:6px 9px}
.brand{font-size:19px}
.info{flex:1;margin-right:10px}
.info>div{padding:7px 5px}
.info small{font-size:8px}
.info strong{font-size:10px}
.shell{margin:6px;height:calc(100dvh - 66px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0}
main{padding:7px;gap:6px}
.sidehead{padding:8px}
.sidehead h2{font-size:14px}
.search{padding:8px;margin-top:7px}
.channel{padding:17px 10px;font-size:18px}
#title{font-size:17px}
.controls{bottom:8px;gap:7px;padding:7px 9px}
.ctrl{width:40px;height:40px}
}
@media(max-width:850px) and (orientation:landscape){
header{height:45px}
.shell{margin:5px;height:calc(100dvh - 55px)}
main{padding:6px}
.channel{padding:10px;font-size:15px}
}
</style>
</head>
<body>

<header>
<div class="brand">RIMAL<span>TECH</span></div>
<div class="info">
<div><small>الوقت · العراق</small><strong id="clock">--:--:--</strong></div>
<div><small>طقس بغداد</small><strong id="temp">--°م</strong></div>
<div><small>تاريخ اليوم</small><strong id="date">--</strong></div>
</div>
</header>

<div class="shell">
<aside>
<div class="sidehead">
<h2>قائمة القنوات</h2>
<input id="search" class="search" placeholder="ابحث عن قناة...">
</div>
<div class="list" id="list"></div>
</aside>

<main>
<div>
<div id="title">RIMALTECH</div>
<div id="group">اختر قناة للمشاهدة</div>
</div>

<div class="player" id="player">
<img class="nature" id="nature" alt="الطبيعة">
<div class="welcome" id="welcome">
<div>
<h1>RIMAL<span>TECH</span></h1>
<p>اكتشف جمال الطبيعة حول العالم</p>
<small id="location">وجهات سياحية مميزة</small>
</div>
</div>

<div id="loading" hidden>
<div class="spinner"></div>
<p id="loadingText">جارٍ تحميل البث...</p>
</div>

<video id="video" playsinline preload="none" hidden></video>

<div class="controls">
<button class="ctrl" id="play" aria-label="تشغيل">
<svg id="playIcon" viewBox="0 0 24 24"><path d="m9 6 10 6-10 6z"/></svg>
</button>
<button class="ctrl" id="mute" aria-label="كتم الصوت">
<svg id="muteIcon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a5 5 0 0 1 0 6"/></svg>
</button>
<button class="ctrl" id="full" aria-label="ملء الشاشة">
<svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
</button>
</div>
</div>

<div class="footer">
<span id="status">جاهز للمشاهدة</span>
<span>بدعم <b>RIMALTECH</b></span>
</div>
</main>
</div>

<script>
const $=id=>document.getElementById(id),v=$("video"),p=$("player"),load=$("loading");

const channels=[
{"name":"Rimal OTT","group":"مجموعة الرمال","url":"https://web.aboozayed.web.id/hirimal/index.m3u8"},
{"name":"بي إن سبورت 1","group":"الرياضة","url":"https://web.aboozayed.web.id/1/index.m3u8"},
{"name":"بي إن سبورت 2","group":"الرياضة","url":"https://web.aboozayed.web.id/2/index.m3u8"},
{"name":"بي إن سبورت 3","group":"الرياضة","url":"https://web.aboozayed.web.id/3/index.m3u8"},
{"name":"بي إن سبورت 4","group":"الرياضة","url":"https://web.aboozayed.web.id/4/index.m3u8"},
{"name":"بي إن سبورت 5","group":"الرياضة","url":"https://web.aboozayed.web.id/5/index.m3u8"},
{"name":"بي إن سبورت 6","group":"الرياضة","url":"https://web.aboozayed.web.id/6/index.m3u8"},
{"name":"بي إن سبورت 7","group":"الرياضة","url":"https://web.aboozayed.web.id/7/index.m3u8"},
{"name":"بي إن سبورت 8","group":"الرياضة","url":"https://web.aboozayed.web.id/8/index.m3u8"},
{"name":"بي إن سبورت 9","group":"الرياضة","url":"https://web.aboozayed.web.id/9/index.m3u8"},
{"name":"ثمانية 1","group":"قنوات متنوعة","url":"https://web.aboozayed.web.id/th1/index.m3u8"},
{"name":"ثمانية 2","group":"قنوات متنوعة","url":"https://web.aboozayed.web.id/th2/index.m3u8"},
{"name":"ثمانية 3","group":"قنوات متنوعة","url":"https://web.aboozayed.web.id/th3/index.m3u8"},
{"name":"الفجر فلسطين 1","group":"قنوات متنوعة","url":"https://web.aboozayed.web.id/alfjr1/index.m3u8"},
{"name":"الفجر فلسطين 2","group":"قنوات متنوعة","url":"https://web.aboozayed.web.id/alfjr2/index.m3u8"},
{"name":"الفجر فلسطين 3","group":"قنوات متنوعة","url":"https://web.aboozayed.web.id/alfjr3/index.m3u8"},
{"name":"الفجر فلسطين 4","group":"قنوات متنوعة","url":"https://web.aboozayed.web.id/alfjr4/index.m3u8"},
{"name":"الفجر فلسطين 5","group":"قنوات متنوعة","url":"https://web.aboozayed.web.id/alfjr5/index.m3u8"},
{"name":"TNT Sports 1","group":"الرياضة","url":"https://web.aboozayed.web.id/tnt1/index.m3u8"},
{"name":"TNT Sports 2","group":"الرياضة","url":"https://web.aboozayed.web.id/tnt2/index.m3u8"},
{"name":"TNT Sports 3","group":"الرياضة","url":"https://web.aboozayed.web.id/tnt3/index.m3u8"},
{"name":"TNT Sports 4","group":"الرياضة","url":"https://web.aboozayed.web.id/tnt4/index.m3u8"},
{"name":"ON Sport","group":"الرياضة","url":"https://web.aboozayed.web.id/Onsp/index.m3u8"},
{"name":"Al Iraqiya","group":"الرياضة","url":"https://web.aboozayed.web.id/aliraqiya/index.m3u8"},
{"name":"Go3 Sport 1","group":"الرياضة","url":"https://web.aboozayed.web.id/go1/index.m3u8"},
{"name":"Go3 Sport 2","group":"الرياضة","url":"https://web.aboozayed.web.id/go2/index.m3u8"},
{"name":"Go3 Sport 3","group":"الرياضة","url":"https://web.aboozayed.web.id/go3/index.m3u8"},
{"name":"CANAL+ Sport 1","group":"الرياضة","url":"https://web.aboozayed.web.id/CanalFr1/index.m3u8"},
{"name":"CANAL+ Sport 2","group":"الرياضة","url":"https://web.aboozayed.web.id/CanalFr2/index.m3u8"},
{"name":"CANAL+ Sport 3","group":"الرياضة","url":"https://dash4.antik.sk/live/test_euronews/playlist.m3u8"},
{"name":"CANAL+ Sport 4","group":"الرياضة","url":"https://web.aboozayed.web.id/CanalFr4/index.m3u8"},
{"name":"CANAL+ Sport 5","group":"الرياضة","url":"https://web.aboozayed.web.id/CanalFr5/index.m3u8"},
{"name":"الرابعة العراقية","group":"قنوات متنوعة","url":"https://web.aboozayed.web.id/Alrabiaa/index.m3u8"},
{"name":"قناة القرآن الكريم من مكة","group":"قنوات متنوعة","url":"https://cdn-globecast.akamaized.net/live/eds/saudi_quran/hls_roku/index.m3u8"},
{"name":"قناة السنة النبوية من المدينة","group":"قنوات متنوعة","url":"https://ameditv.ai.studio/api/proxy?url=http://m.live.net.sa:1935/live/sunnah/playlist.m3u8"},
{"name":"ستارزبلاي","group":"قنوات متنوعة","url":"https://dash4.antik.sk/live/test_euronews/playlist.m3u8"}
];

const scenes=[
["https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80","البحيرات والجبال"],
["https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80","الطبيعة الساحرة"],
["https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80","قمم الجبال"],
["https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1200&q=80","شروق الشمس"]
];

let selected=-1,hls=null,si=0,ht;

function render(){
const q=$("search").value.trim().toLowerCase();
$("list").replaceChildren(...channels.map((c,i)=>{
const b=document.createElement("button");
b.className="channel"+(i===selected?" active":"");
b.textContent=c.name;
b.hidden=!c.name.toLowerCase().includes(q);
b.onclick=()=>select(i);
return b;
}));
}

function scene(){
if(selected<0){
const s=scenes[si++%scenes.length];
$("nature").src=s[0];
$("location").textContent=s[1];
p.classList.remove("playing","hide");
}
}

function controls(){
if(selected<0)return;
p.classList.remove("hide");
clearTimeout(ht);
if(!v.paused)ht=setTimeout(()=>p.classList.add("hide"),3000);
}

function select(i){
if(hls){hls.destroy();hls=null}
v.pause();
v.removeAttribute("src");
v.load();

selected=i;
render();

const c=channels[i];
$("title").textContent=c.name;
$("group").textContent=c.group;
$("welcome").hidden=true;
$("nature").hidden=true;
v.hidden=false;
p.classList.remove("playing","hide");
load.hidden=false;
$("playIcon").innerHTML='<path d="m9 6 10 6-10 6z"/>';
$("loadingText").textContent="جارٍ تحميل البث...";
$("status").textContent="جارٍ تحميل البث...";

if(!c.url)return;

const start=()=>{
if(selected===i)v.play().catch(()=>$("loadingText").textContent="اضغط تشغيل لبدء البث");
};

if(window.Hls&&Hls.isSupported()){
hls=new Hls();
hls.on(Hls.Events.MANIFEST_PARSED,start);
hls.on(Hls.Events.ERROR,(_,d)=>{
if(d.fatal&&selected===i){
$("loadingText").textContent="تعذر تحميل البث";
$("status").textContent="خطأ في البث";
}
});
hls.loadSource(c.url);
hls.attachMedia(v);
}else if(v.canPlayType("application/vnd.apple.mpegurl")){
v.src=c.url;
v.onloadedmetadata=start;
v.load();
}else{
$("loadingText").textContent="المتصفح لا يدعم البث";
}
}

v.onplaying=()=>{
load.hidden=true;
p.classList.add("playing");
$("status").textContent="البث يعمل";
$("playIcon").innerHTML='<path d="M8 5v14M16 5v14"/>';
controls();
};

v.onpause=()=>{
if(selected>=0){
$("playIcon").innerHTML='<path d="m9 6 10 6-10 6z"/>';
$("status").textContent="متوقف مؤقتاً";
p.classList.remove("hide");
clearTimeout(ht);
}
};

v.onerror=()=>{
if(selected>=0){
load.hidden=false;
$("loadingText").textContent="تعذر تشغيل القناة";
$("status").textContent="خطأ في التشغيل";
}
};

$("play").onclick=e=>{
e.stopPropagation();
if(selected>=0){
if(v.paused)v.play().catch(()=>$("loadingText").textContent="تعذر تشغيل البث");
else v.pause();
}
};

$("mute").onclick=e=>{
e.stopPropagation();
v.muted=!v.muted;
$("muteIcon").innerHTML=v.muted
?'<path d="M4 9v6h4l5 4V5L8 9zM16 9l5 6m0-6-5 6"/>'
:'<path d="M4 9v6h4l5 4V5L8 9zM16 9a5 5 0 0 1 0 6"/>';
controls();
};

$("full").onclick=async e=>{
e.stopPropagation();
try{
if(document.fullscreenElement)await document.exitFullscreen();
else await p.requestFullscreen();
}catch(err){}
controls();
};

p.onclick=e=>{
if(!e.target.closest("button"))controls();
};
p.onmousemove=controls;
p.ontouchstart=()=>{if(selected>=0)controls()};
$("search").oninput=render;

function clock(){
const d=new Date,z="Asia/Baghdad";
$("clock").textContent=new Intl.DateTimeFormat("en-GB",{timeZone:z,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(d);
$("date").textContent=new Intl.DateTimeFormat("ar-IQ",{timeZone:z,dateStyle:"medium"}).format(d);
}
clock();
setInterval(clock,1000);

async function weather(){
try{
const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=33.3152&longitude=44.3661&current=temperature_2m&timezone=Asia%2FBaghdad");
if(!r.ok)throw Error();
const data=await r.json();
$("temp").textContent=Math.round(data.current.temperature_2m)+"°م";
}catch{$("temp").textContent="--°م"}
}
weather();
setInterval(weather,600000);

render();
scene();
setInterval(scene,10000);
</script>
</body>
</html>
