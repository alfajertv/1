
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<title>RIMALTECH | تسجيل الدخول</title>
<style>
:root{--g:#dfc184;--w:#fffaf0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#0b0a08;color:var(--w);font-family:Arial,sans-serif}
body{min-height:100vh;min-height:100dvh}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;opacity:.85;transition:opacity .4s}
body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,#08080666,#080806bb),linear-gradient(0deg,#08080688,transparent 70%)}
main{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,370px);align-items:center;gap:5vw;padding:5vh 9vw}
.branding{min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{direction:ltr;text-align:center;width:100%}
.logo{font-size:clamp(35px,5.5vw,76px);font-weight:900;letter-spacing:2px;white-space:nowrap;text-align:center}
.logo span,h1 span{color:var(--g)}
.ar{margin-top:10px;color:var(--g);font-size:24px;letter-spacing:4px;text-align:center}
.tag{margin-top:16px;color:#ded3bc;font-size:10px;letter-spacing:3px;text-align:center}
.intro{margin-top:45px;max-width:480px;text-align:center}
h1{font-size:clamp(27px,3.5vw,46px);line-height:1.7;margin:0}
.intro p{max-width:430px;margin:10px auto 0;color:#e0d9cb;font-size:13px;line-height:2}
.form{width:100%;max-width:370px;min-width:0;justify-self:end}
h2{font-size:28px;margin:0 0 10px}
.desc{color:#e0d7c6;font-size:13px;line-height:2;margin-bottom:25px}
.field{margin-bottom:20px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:8px}
.input{display:flex;align-items:center;border-bottom:1px solid #ffffff80;transition:border .2s}
.input:focus-within{border-color:var(--g)}
input[type=text],input[type=password]{width:100%;min-width:0;padding:13px 0;background:transparent;border:0;outline:0;color:white;font-size:14px}
input::placeholder{color:#ded4c2}
.eye{border:0;background:none;color:var(--g);cursor:pointer;font-size:12px;padding:8px}
.options{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 24px;color:#eee3d0;font-size:11px}
.remember{display:flex;align-items:center;gap:7px;margin:0;cursor:pointer}
.remember input{accent-color:var(--g)}
.submit{width:100%;padding:15px;border:1px solid var(--g);background:var(--g);color:#17130b;font-size:14px;font-weight:bold;cursor:pointer;transition:background .2s}
.submit:hover{background:#f2dba8}
.message{min-height:24px;margin-top:12px;font-size:12px;line-height:1.8;color:var(--g)}
.bottom{margin-top:22px;color:#e0d5c2;font-size:10px;line-height:2}
@media(orientation:landscape) and (max-height:500px){
 main{grid-template-columns:minmax(0,1fr) minmax(240px,34vw);gap:4vw;padding:12px 6vw}
 .logo{font-size:clamp(30px,5vw,48px)}
 .ar{font-size:18px;margin-top:5px;letter-spacing:3px}
 .tag{font-size:8px;margin-top:8px;letter-spacing:2px}
 .intro{margin-top:20px}
 h1{font-size:clamp(22px,3.2vw,34px);line-height:1.4}
 .intro p{font-size:11px;line-height:1.7}
 h2{font-size:23px;margin-bottom:5px}
 .desc{font-size:11px;margin-bottom:12px}
 .field{margin-bottom:10px}
 label{font-size:11px;margin-bottom:4px}
 input[type=text],input[type=password]{padding:8px 0;font-size:12px}
 .options{margin:5px 0 12px}
 .submit{padding:11px;font-size:12px}
 .message{min-height:17px;margin-top:5px;font-size:10px}
 .bottom{margin-top:8px}
}
@media(orientation:landscape) and (max-height:360px){
 .intro{display:none}
 main{padding-top:8px;padding-bottom:8px}
}
@media(orientation:portrait){
 main{display:flex;flex-direction:column;justify-content:center;gap:30px;padding:30px 24px}
 .branding{width:100%}
 .logo{font-size:43px}
 .ar{font-size:20px}
 .tag{font-size:9px}
 .intro{display:none}
 .form{max-width:420px;margin:auto}
}
@media(prefers-reduced-motion:reduce){.bg{transition:none}}
</style>
</head>
<body>
<img class="bg" id="bg" alt="منظر طبيعي">

<main>
<section class="branding">
<div class="brand">
<div class="logo">RIMAL<span>TECH</span></div>
<div class="ar">ريمال تك</div>
<div class="tag">PREMIUM DIGITAL EXPERIENCE</div>
</div>
<div class="intro">
<h1>عالم الترفيه<br><span>بأسلوب مختلف</span></h1>
<p>اكتشف تجربة رقمية عصرية تجمع بين الأناقة والبساطة، واستمتع بعالمك المفضل من أي مكان.</p>
</div>
</section>

<form class="form" id="login">
<h2>تسجيل الدخول</h2>
<div class="desc">مرحباً بعودتك، أدخل بيانات حسابك للمتابعة.</div>

<div class="field">
<label for="username">اسم المستخدم</label>
<div class="input">
<input id="username" name="username" type="text" placeholder="أدخل اسم المستخدم" autocomplete="username" required>
</div>
</div>

<div class="field">
<label for="password">كلمة المرور</label>
<div class="input">
<input id="password" name="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
<button class="eye" id="eye" type="button">عرض</button>
</div>
</div>

<div class="options">
<label class="remember"><input type="checkbox" id="remember"> تذكرني</label>
<span>دخول آمن</span>
</div>

<button class="submit" type="submit">دخول إلى المنصة ←</button>
<div class="message" id="message" role="status" aria-live="polite"></div>
<div class="bottom">© 2026 RIMALTECH · جميع الحقوق محفوظة</div>
</form>
</main>

<script>
const $=id=>document.getElementById(id);
const photos=[
"photo-1470770841072-f978cf4d019e",
"photo-1464822759023-fed622ff2c3b",
"photo-1500530855697-b586d89ba3ee",
"photo-1507525428034-b723cf961d3e",
"photo-1448375240586-882707db888b",
"photo-1470252649378-9c29740c9fa8",
"photo-1469474968028-56623f02e42e",
"photo-1519681393784-d120267933ba"
];
let i=0;
const bg=$("bg"),url=id=>"https://images.unsplash.com/"+id+"?auto=format&fit=crop&w=2560&q=85";
bg.src=url(photos[0]);

setInterval(()=>{
const n=(i+1)%photos.length,img=new Image();
img.onload=()=>{
bg.style.opacity=0;
setTimeout(()=>{bg.src=img.src;bg.style.opacity=.85;i=n},400);
};
img.onerror=()=>i=n;
img.src=url(photos[n]);
},10000);

$("eye").onclick=()=>{
const p=$("password"),show=p.type==="password";
p.type=show?"text":"password";
$("eye").textContent=show?"إخفاء":"عرض";
};

$("login").onsubmit=e=>{
e.preventDefault();
const ok=$("username").value.trim()==="Kiki"&&$("password").value==="Kiki";
const m=$("message");
m.style.color=ok?"#dfc184":"#ff9999";
m.textContent=ok?"تم تسجيل الدخول بنجاح...":"اسم المستخدم أو كلمة المرور غير صحيحة";
if(ok)setTimeout(()=>location.href="channels.html",600);
};

document.addEventListener("click",()=>{
if(screen.orientation?.lock)
screen.orientation.lock("landscape").catch(()=>{});
},{once:true});
</script>
</body>
</html>
